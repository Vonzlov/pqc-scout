# На каждый пуш: ruff и тесты, то же самое, что запускаем локально перед коммитом.
name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # --locked: если uv.lock не совпадает с pyproject.toml, сборка падает
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest
