[project]
name = "pqc-scout"
version = "0.0.1"
description = "Migration assistant for moving Python projects to post-quantum cryptography"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nikita Kozlov" }]
requires-python = ">=3.12"
dependencies = [
    # ML-KEM и ML-DSA появились в cryptography 48. Начиная с 49 нет готовых сборок
    # для macOS на Intel, а на нём тоже идёт разработка, поэтому держимся 48.x везде.
    # Поднимем версию, когда понадобится что-то из 49+ (например, сертификаты ML-DSA).
    "cryptography>=48,<49",
    "langgraph>=1.2.15",
    "typer>=0.27",
]

[project.scripts]
pqc-scout = "pqc_scout.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W — стиль, F — ошибки вроде неиспользуемых импортов, I — порядок импортов,
# UP — устаревший синтаксис, B — типичные баги.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
